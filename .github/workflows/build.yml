name: Build NFSMW R36Ultra

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: debian:11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt update
          apt install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            zip \
            unzip \
            file \
            rsync

      - name: Create toolchain aliases
        run: |
          ln -sf /usr/bin/arm-linux-gnueabihf-gcc /usr/local/bin/arm-unknown-linux-gnueabihf-gcc
          ln -sf /usr/bin/arm-linux-gnueabihf-g++ /usr/local/bin/arm-unknown-linux-gnueabihf-g++
          ln -sf /usr/bin/arm-linux-gnueabihf-objcopy /usr/local/bin/arm-unknown-linux-gnueabihf-objcopy
          ln -sf /usr/bin/arm-linux-gnueabihf-objdump /usr/local/bin/arm-unknown-linux-gnueabihf-objdump

      - name: Verify toolchain
        run: |
          which arm-unknown-linux-gnueabihf-gcc || true
          which arm-unknown-linux-gnueabihf-g++ || true
          which arm-unknown-linux-gnueabihf-objcopy || true
          which arm-unknown-linux-gnueabihf-objdump || true

          arm-unknown-linux-gnueabihf-gcc --version

      - name: Build runtime
        run: |
          make -C runtime

      - name: Build PortMaster package
        run: |
          chmod +x portmaster/build_port.sh
          portmaster/build_port.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-r36ultra-build
          path: |
            runtime/build
            portmaster
