name: Build NFSMW R36Ultra

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf
            binutils-arm-linux-gnueabihf

      - name: Create compiler symlink
        run: |
          sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc /usr/local/bin/arm-unknown-linux

      - name: Verify compiler
        run: |
          which arm-unknown-linux-gnueabihf-gcc
          arm-unknown-linux-gnueabihf-gcc --version

      - name: Build runtime
        run: |
          make -C runtime

      - name: Build PortMaster package
        run: |
          chmod +x portmaster/build_port.sh
          portmaster/build_port.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-r36ultra-build
          path: |
            runtime/build
            portmaster
