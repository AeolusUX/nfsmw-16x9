name: Build NFSMW 16x9

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: debian:11

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Point apt at Debian archive (bullseye is EOL)
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            zip \
            unzip \
            file \
            rsync \
            git \
            ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create toolchain aliases
        run: |
          ln -sf /usr/bin/arm-linux-gnueabihf-gcc /usr/local/bin/arm-unknown-linux-gnueabihf-gcc
          ln -sf /usr/bin/arm-linux-gnueabihf-g++ /usr/local/bin/arm-unknown-linux-gnueabihf-g++
          ln -sf /usr/bin/arm-linux-gnueabihf-objcopy /usr/local/bin/arm-unknown-linux-gnueabihf-objcopy
          ln -sf /usr/bin/arm-linux-gnueabihf-objdump /usr/local/bin/arm-unknown-linux-gnueabihf-objdump

      - name: Verify toolchain
        run: |
          which arm-unknown-linux-gnueabihf-gcc
          which arm-unknown-linux-gnueabihf-g++
          which arm-unknown-linux-gnueabihf-objcopy
          which arm-unknown-linux-gnueabihf-objdump
          arm-unknown-linux-gnueabihf-gcc --version

      - name: Build runtime
        run: |
          make -C runtime

      - name: Build PortMaster package
        run: |
          chmod +x portmaster/build_port.sh
          portmaster/build_port.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-r36ultra-build
          path: |
            runtime/build
            portmaster
